name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "release tag $RELEASE_TAG does not match package version $expected" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run acceptance gate
        run: npm run gate
      - name: Pack release artifact
        shell: bash
        run: |
          mkdir -p release
          package_path="release/firstmate-dsh-$(node -p "require('./package.json').version").tgz"
          npm pack --pack-destination release
          test -f "$package_path"
          echo "PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"
          cd release
          sha256sum "$(basename "$package_path")" > SHA256SUMS
      - name: Smoke install packed artifact in DSH Web
        run: FIRSTMATE_DSH_INSTALL_SPEC="$GITHUB_WORKSPACE/$PACKAGE_PATH" npm run smoke:dsh
      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$PACKAGE_PATH" --access public --provenance
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: firstmate-dsh-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/*.tgz release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Firstmate for DeepSeek Harness $RELEASE_TAG"
