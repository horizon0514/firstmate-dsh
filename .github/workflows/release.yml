name: Release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run acceptance gate
        run: npm run gate
      - name: Pack release artifact
        shell: bash
        run: |
          mkdir -p release
          package_path="release/firstmate-dsh-$(node -p "require('./package.json').version").tgz"
          npm pack --pack-destination release
          test -f "$package_path"
          echo "PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"
          cd release
          sha256sum "$(basename "$package_path")" > SHA256SUMS
      - name: Smoke install packed artifact in DSH Web
        run: FIRSTMATE_DSH_INSTALL_SPEC="$GITHUB_WORKSPACE/$PACKAGE_PATH" npm run smoke:dsh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: firstmate-dsh-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.tgz release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Firstmate for DeepSeek Harness $GITHUB_REF_NAME"
